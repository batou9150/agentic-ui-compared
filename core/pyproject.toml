[project]
name = "weather-core"
version = "0.1.0"
description = "Weather and local time domain shared by both implementations (Open-Meteo client, typed models)."
license = "MIT"
authors = [{ name = "Baptiste PIRAULT" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_core"]
