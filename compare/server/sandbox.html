<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MCP Apps sandbox proxy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      // Sandbox proxy (MCP Apps 2026-01-26, "Sandbox proxy"): served from a
      // different origin than the host, with the view's CSP as an HTTP header.
      // It loads the view HTML into an inner iframe and relays JSON-RPC
      // messages both ways, except its own ui/notifications/sandbox-* ones.
      (() => {
        const READY = "ui/notifications/sandbox-proxy-ready";
        const RESOURCE = "ui/notifications/sandbox-resource-ready";
        const hostOrigin = document.referrer ? new URL(document.referrer).origin : "";
        if (window === window.top || !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(hostOrigin)) {
          document.body.textContent = "This page only runs inside the compare harness.";
          return;
        }
        const inner = document.createElement("iframe");
        inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
        document.body.append(inner);

        window.addEventListener("message", (event) => {
          if (event.source === window.parent && event.origin === hostOrigin) {
            const data = event.data;
            if (data && data.method === RESOURCE) {
              const { html, sandbox } = data.params || {};
              if (typeof sandbox === "string") inner.setAttribute("sandbox", sandbox);
              if (typeof html === "string") inner.srcdoc = html; // inherits this page's CSP
            } else {
              inner.contentWindow?.postMessage(data, "*");
            }
          } else if (event.source === inner.contentWindow) {
            window.parent.postMessage(event.data, hostOrigin);
          }
        });
        window.parent.postMessage({ jsonrpc: "2.0", method: READY, params: {} }, hostOrigin);
      })();
    </script>
  </body>
</html>
