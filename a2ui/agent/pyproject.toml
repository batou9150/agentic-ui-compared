[project]
name = "a2ui-agent"
version = "0.1.0"
description = "ADK agent exposing weather_core and emitting A2UI messages over A2A."
license = "MIT"
authors = [{ name = "Baptiste PIRAULT" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "weather-core",
    "google-adk==2.11.0",
    "google-genai==2.28.0",
    "a2ui-agent-sdk==0.7.0",
    "a2ui-core==0.2.0",
    "a2a-sdk[http-server]==0.3.26",
    "uvicorn==0.54.0",
    "starlette==1.7.0",
]

[project.scripts]
a2ui-agent = "a2ui_agent.__main__:main"

[tool.uv.sources]
weather-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui_agent"]
